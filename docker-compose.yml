name: webthoitrang

services:
  webthoitrang:
    container_name: webthoitrang
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8083:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Server=webthoitrang-db,1433;Database=WebThoiTrang;User Id=sa;Password=${SQL_PASSWORD};TrustServerCertificate=True;Encrypt=False
      Gemini__ApiKey: ${GEMINI_API_KEY}
      VNPay__TmnCode: ${VNPAY_TMN_CODE}
      VNPay__HashSecret: ${VNPAY_HASH_SECRET}
      VNPay__Url: ${VNPAY_URL}
      VNPay__ReturnUrl: ${VNPAY_RETURN_URL}
      MomoAPI__MomoApiUrl: ${MOMO_API_URL}
      MomoAPI__PartnerCode: ${MOMO_PARTNER_CODE}
      MomoAPI__AccessKey: ${MOMO_ACCESS_KEY}
      MomoAPI__SecretKey: ${MOMO_SECRET_KEY}
      MomoAPI__ReturnUrl: ${MOMO_RETURN_URL}
      MomoAPI__NotifyUrl: ${MOMO_NOTIFY_URL}
      MomoAPI__RequestType: ${MOMO_REQUEST_TYPE}
    depends_on:
      - webthoitrang-db
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  webthoitrang-db:
    container_name: webthoitrang-db
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    ports:
      - "14333:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_PASSWORD}
      MSSQL_PID: Developer
    volumes:
      - webthoitrang-sql-data:/var/opt/mssql
    restart: unless-stopped

volumes:
  webthoitrang-sql-data:
    name: webthoitrang-sql-data
